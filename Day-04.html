<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
    <form style="border: 2px solid black; background-color:bisque; ">
    <h1><center>Student Registration Form</center></h1>
    <label>Roll No.:</label>
    <input type="number"><br><br>

    <label>Student Name:</label>
    <input type="text" placeholder="First name"> -
    <input type="text" placeholder="Last Name"><br><br>
     
    <label>Fathers Name:</label>
    <input type="text"><br><br>

    <label>DOB:</label>
    <input type="number" placeholder="day"> - <input type="text" placeholder="month"> - <input type="number" placeholder="Year"><br><br>

    <label>Mobile no.:</label>
    <input type="number"><br><br>

    <label>Email:</label>
    <input type="email"><br><br>

    <label>Password:</label>
    <input type="password" minlength="9" maxlength="12"><br><br>

    <label>Gender:</label>
    <input type="radio" name="radio"><label>Male</label>
    <input type="radio" name="radio"><label>Female</label><br><br>

    <label> Department:</label>
    <input type="checkbox"><label>CSE </label>
    <input type="checkbox"><label>IT</label>
    <input type="checkbox"><label>ECE</label>
    <input type="checkbox"><label>CIVIL</label>
    <input type="checkbox"><label>MECH</label><br><br>

    <label>Course:</label>
    <select>
      <option>-----select------</option>
      <option>Python</option>
      <option>Java</option>
      <option>HTML</option>
    </select><br><br>

    <label>Student Photo:</label>
    <input type="file"><br><br>

    <label>City:</label>
    <input type="text"><br><br>

    <label>Address:</label>
    <textarea></textarea><br><br>

   <center><input type="button" value="Register"></center>
  </form>
</body>
</html>
